name: Build and publish deploy branch

on:
  push:
    branches: [main]
    paths-ignore:
      - "panel/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      # Publica el sitio compilado (out/) en la rama `deploy`. Esa rama
      # es la que está conectada en hPanel (Avanzado > Git) para que
      # Hostinger despliegue solo en cada push.
      - name: Publish build to deploy branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          force_orphan: true
