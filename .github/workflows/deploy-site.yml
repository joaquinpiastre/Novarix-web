name: Deploy site to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - "panel/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      # Publica el sitio compilado (out/) en la rama `deploy`. Esta rama
      # es la que hay que conectar en hPanel (Avanzado > Git > Connect
      # with GitHub) para que Hostinger despliegue solo en cada push,
      # sin FTP. Va antes que el paso de FTP para que se cumpla aunque
      # el FTP siga fallando.
      - name: Publish build to deploy branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          force_orphan: true

      # TEMPORAL: se mantiene mientras se valida el deploy automático de
      # Hostinger vía la rama `deploy` (paso de arriba). Sacar este paso
      # y los secrets HOSTINGER_FTP_* una vez confirmado que hPanel
      # despliega solo desde esa rama. continue-on-error para que, si
      # sigue fallando (los últimos 2 runs fallaron acá), no bloquee el
      # resto del deploy.
      - name: Deploy to Hostinger via FTP
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR || '/public_html/' }}
