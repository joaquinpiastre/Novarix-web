name: Panel tests

on:
  push:
    branches: [main]
    paths:
      - "panel/**"
  pull_request:
    paths:
      - "panel/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
